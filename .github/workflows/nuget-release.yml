name: NuGet Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

# Two tags pushed close together must not publish concurrently; a started
# release is never cancelled half way. GitHub keeps at most one pending run per
# group, so if a third run queues while one is running and one is pending, the
# older pending run is cancelled; re-push or re-run that tag if it happens.
concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  # No secrets and no OIDC token here: this job runs repository code (restore,
  # build, test), so it must not be able to publish anything.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full history so the tag-on-main ancestry check can run.
        fetch-depth: 0
        persist-credentials: false

    - name: Require tagged commit to be on main
      run: |
        git fetch --no-tags origin main
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
          exit 1
        fi

    - name: Require tag to match package version
      run: |
        version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Manifesto.RazorKit.csproj | head -n 1)
        if [ -z "$version" ]; then
          echo "::error::No <Version> found in Manifesto.RazorKit.csproj."
          exit 1
        fi
        if [ "$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag '$GITHUB_REF_NAME' does not match <Version> '$version' in Manifesto.RazorKit.csproj."
          exit 1
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        # The package multi-targets net8.0, net9.0 and net10.0.
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore
      run: dotnet restore Manifesto.RazorKit.sln

    - name: Build
      run: dotnet build Manifesto.RazorKit.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test Manifesto.RazorKit.sln --configuration Release --no-build

    - name: Pack
      run: dotnet pack Manifesto.RazorKit.csproj --configuration Release --no-build -o ./artifacts

    # The tag==version check runs earlier, but this confirms the file that will
    # ship carries that version, and the hashes let the environment approver
    # compare what they are releasing against what the build produced.
    - name: Verify package and record checksums
      run: |
        nupkg="./artifacts/Manifesto.RazorKit.$GITHUB_REF_NAME.nupkg"
        snupkg="./artifacts/Manifesto.RazorKit.$GITHUB_REF_NAME.snupkg"
        for f in "$nupkg" "$snupkg"; do
          if [ ! -f "$f" ]; then
            echo "::error::Expected package $f was not produced."
            exit 1
          fi
        done
        {
          echo "### Package checksums (SHA-256)"
          echo
          echo '```'
          (cd artifacts && sha256sum "$(basename "$nupkg")" "$(basename "$snupkg")")
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nupkg
        path: ./artifacts/Manifesto.RazorKit.*nupkg
        if-no-files-found: error

  # Only job with a credential. The protected environment gates it behind
  # required reviewers, and the OIDC token is exchanged for a short-lived
  # nuget.org API key by the trusted-publishing policy on nuget.org.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget-release
    permissions:
      id-token: write

    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Download package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: nupkg
        path: ./artifacts

    - name: NuGet login (trusted publishing)
      id: login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ secrets.NUGET_USER }}

    # No --skip-duplicate: pushing a version that already exists must fail loudly.
    - name: Push to NuGet
      env:
        NUGET_PUSH_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_PUSH_KEY" --source https://api.nuget.org/v3/index.json
